name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pfm_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dipendenze
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Esegui i test
        run: pytest -v

  frontend:
    name: Frontend (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pfm_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pfm_frontend/package-lock.json
      - name: Install dipendenze
        run: npm ci
      - name: Controllo tipi TypeScript
        run: npx tsc --noEmit
